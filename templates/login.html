<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RJ Stocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <style>
        body {
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full">
        <!-- Dark mode toggle on login page too -->
        <div class="text-right mb-4">
            <button id="darkModeToggle" onclick="window.toggleDarkMode()" 
                    class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/80 dark:bg-gray-800/80 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all text-sm shadow-sm">
                <i id="darkModeIcon" class="fas fa-moon"></i>
                <span id="darkModeText">Dark</span>
            </button>
        </div>
        
        <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 dark:border-gray-700/50 p-8">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-br from-indigo-600 to-blue-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-boxes text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 dark:text-white">RJ Stocks</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1">Inventory Management System</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Username</label>
                    <input type="text" id="username" required 
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <input type="password" id="password" required 
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-200">
                </div>
                <button type="submit" 
                        class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-semibold py-3 rounded-xl transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login
                </button>
            </form>
            
            <div class="mt-6 p-3 bg-gray-50 dark:bg-gray-700/50 rounded-lg text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400">
                    <i class="fas fa-info-circle"></i> Demo credentials:<br>
                    admin / admin123 &nbsp;|&nbsp; manager / manager123
                </p>
            </div>
        </div>

        <div id="errorMsg" class="hidden mt-4 bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-xl">
            <span id="errorText"></span>
        </div>
    </div>

    <script src="/static/darkmode.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });
            const data = await response.json();
            
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                document.getElementById("errorText").innerText = data.error;
                document.getElementById("errorMsg").classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
